# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit config — review of Workshop 9 submission PRs ("Software Factory").
# The work itself lives in each participant's own repository (model v2, as in WS6–WS8): the PM's requirements repo
# <pm>/<team-slug>-spec (slice-3 clarifications with a change log, slice-4 requirement and 10 golden cases for WS10,
# answers to issues «Питання до вимог») and every developer's own implementation repo <dev>/<team-slug> (D0;
# the WHOLE slice 3 implemented the usual way: /requirements-sync, spec add-<slice3>, task PRs, tests per AC, UAT on
# prod and a proof pack row for EVERY AC; PM deviations as issues «Відхилення від вимог»). PM acceptance scores live
# in the course's private Google Sheet. Optional bonus: a factory twin <dev>/<team-slug>-factory with its own deployment.
# The instructor's pipeline grades the repo at the main SHA from the submission file. Here CodeRabbit checks ONLY the
# submission PR: one new file submissions/<team-slug>/<github-login>.md, its fields, and that nothing else changed.
# Every check is STATIC over the diff and the PR description: no network, no npm, no tests, no cloning of linked
# repositories.
# Limits: custom check names < 50 chars, tone_instructions ≤ 250 chars — otherwise CodeRabbit
# silently ignores the WHOLE file (tells: review in English, docstring check reappears).

language: "uk-UA"
tone_instructions: >-
  Ментор курсу. Українською, коротко й доброзичливо. Перевіряєш лише файл здачі WS9 і опис PR.
  Статуси: ✅ зроблено, ⚠️ частково, ❌ бракує.

early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - ".*"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"

  # Every path of the repository is listed, so that changes outside submissions/ are visible
  # to the "nothing else changed" check.
  path_filters:
    - "submissions/**"
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "LICENSE"
    - "docs/**"
    - "materials/**"
    - ".github/**"
    - ".coderabbit.yaml"
    - ".gitignore"
    - ".gitattributes"
    - "**"

  path_instructions:
    - path: "submissions/*/*.md"
      instructions: |
        Файл здачі WS9. Статичне рев'ю, посилань не відкривай і нічого не запускай.
        Шлях: submissions/<team-slug>/<github-login>.md; team-slug — рівно один із
        property-workflows, therapy-scheduling, school-purchasing, leave-portal; ім'я файла
        (без .md) збігається з полем «GitHub-логін» і, якщо видно, з логіном автора PR (без
        урахування регістру). Розділ «Дані»: «Роль» — pm або dev; «Команда» — та сама, що тека;
        «Ваше репо» — https://github.com/<owner>/<repo>, owner — «GitHub-логін» (інакше ⚠️); назва
        репо для pm зазвичай <team-slug>-spec, для dev — <team-slug> (інша — ⚠️, не ❌; репо-двійник
        <team-slug>-factory як «Ваше репо» — ❌: двійник лише в розділі «Бонус»); «SHA» — рівно 40 символів
        [0-9a-f] (коротший SHA, гілка чи тег — ❌); «Репо вимог PM» — https://github.com/<owner>/<repo>, для pm —
        те саме, що «Ваше репо»; «Прод-URL» — для dev https://… (зазвичай *.vercel.app), для pm — «—».
        Роль pm заповнює розділ «PM», а розділ «Розробник» — рівно «—»; роль dev — навпаки.
        pm: «Сховище вимог» — issues, docs або docs/; «Зріз 3» — одне речення; «Вимоги зрізу 3» — …/issues/N
        або …/blob/<SHA>/docs/requirements/…; «Питання, на які ви відповіли» — …/issues/N або «питань не було»;
        «Зміни вимог із журналом змін» — щонайменше одне посилання на коментар, коміт чи файл («змін не було» —
        ⚠️: рубрика A вимагає щонайменше одну зміну, без питань — «власне рішення PM»). Підрозділ «Приймання
        зрізу 3»: рядки з оцінками живуть у приватній Google Таблиці курсу, тож markdown-таблиці тут немає, і
        це правильно. «Таблиця приймання PM» — «заповнено» з логінами розробників команди й AC ID зрізу 3 (без
        логінів — ⚠️); адреса docs.google.com у файлі — ⚠️ (репо публічне, адресу таблиці сюди не пишуть);
        «Відхилення від вимог» — посилання https://github.com/<dev>/<repo>/issues/N у репо розробників (owner ≠
        «Ваше репо» — це нормально) або «відхилень немає»; «Звірка …» — текст про знайдену розбіжність або
        «перевірено: розбіжностей немає» з тим, що звірено; «Підпис у репо розробників» — посилання на коментарі
        в репо розробників; «Повторні перевірки» — посилання на коментарі …#issuecomment-M або «"Виправлено" не
        надходило». Підрозділ «Зріз 4 для WS10»: «Зріз 4» — одне речення про AI-функцію; «Вимога зрізу 4» —
        …/issues/N або …/blob/<SHA>/docs/requirements/…; «AC відмови й стану» — щонайменше один AC ID відмови і
        один AC ID стану з видом (інакше ⚠️); AC ID — AC-<2–12 великих латинських літер>-<дві цифри>; «Golden
        cases» — …/blob/<SHA>/docs/golden-cases.md або …/issues/N; «Roadmap» — коментар чи коміт.
        dev: розділ «D0»: «/api/health» — https://…/api/health з тим самим хостом, що «Прод-URL»; «Зелений
        прогін smoke» — …/actions/runs/N у «Ваше репо»; «accounts.zip на SHA» — …/blob/<SHA>/accounts.zip у
        «Ваше репо» (посилання на accounts.txt чи будь-який інший файл з паролями — ❌); «Ролі тестових
        акаунтів» — лише ролі й адреси *@example.test, щонайменше одна роль; «Версія next» — 16.4.1 чи новіша
        (16.4.0 і нижче — ❌: D0 не виконано). Підрозділ «Зріз 3 звичайним способом»: «AC зрізу 3» — список AC ID
        (менше трьох — ⚠️: зріз 3 береться цілком); PR-поля (A, B, C) — …/pull/N у «Ваше репо»; «Після уточнень
        PM» — …/pull/N або рядок «/requirements-sync <YYYY-MM-DD>: Вимоги актуальні»; «Питання PM» — посилання
        …/issues/N у репо вимог PM або «питань не було»; «Тести відмов здатні впасти» — AC ID з посиланнями
        …/pull/N чи …/actions/runs/N; «Ворота й db-deploy» — два посилання …/actions/runs/N; «UAT —
        специфікації» — щонайменше одне посилання …/blob/<SHA>/tests/e2e/….spec.ts; «UAT — звіт на проді» —
        …/blob/<SHA>/docs/qa/uat/<YYYY-MM-DD>/report.md; «QA proof pack» — …/blob/<SHA>/docs/qa/proof-pack.md;
        «Не перевірено» — AC ID з причиною або «немає»; «Відхилення від PM (C)» — …/issues/N з відповідями або
        «не надходило»; «Рядки docs/conformance.md» — …/blob/<SHA>/docs/conformance.md; «Акаунти для нових ролей
        зрізу 3» — ролі з адресами *@example.test або «нових ролей немає»; «Ретро» — …/blob/<SHA>/….md(#…).
        Розділ «Бонус» — рівно «—» або заповнений підрозділ своєї ролі (іншої — «—»). Бонус розробника: «Репо
        двійника» — https://github.com/<owner>/<team-slug>-factory (те саме owner, що «Ваше репо»; репо двійника
        = «Ваше репо» — ❌); «SHA двійника» — 40 hex; «Прод двійника» — https://… з іншим хостом, ніж «Прод-URL»
        (той самий хост — ❌: фабрика не має торкатися основного проду); «Прогони фабрики» — run id зі станом;
        «Пакети доказів» — дайджест і місце; «PR фабрики з автозлиттям», «UAT на проді двійника», «Звіт
        порівняння» — посилання на двійник чи «Ваше репо»; частковий прогін з чесним поясненням — нормально.
        Ще поля бонусу розробника: «Тег ws9-base в основному репо» — https://github.com/<owner>/<team-slug>/tree/ws9-base
        у «Ваше репо»; «Формат вимог PM» — де й як PM пише AC (docs чи issues; lines, table, block чи свій адаптер);
        «Червоні тести (tests-first)» — …/tree/ws9-red або …/commit/<sha> у репо двійника з AC ID; «Приховані сценарії» — назва набору,
        кількість на AC і «запечатано» (посилання на відкритий holdouts/*.json у репо двійника — ❌: будівельник
        фабрики міг би його прочитати; значення FACTORY_HOLDOUT_KEY — ❌); «AC, які доводить лише UAT» — AC ID або
        «немає». «Прогони фабрики» — кожен run id виду run-<14 цифр>-<6 hex> зі станом (released, refused,
        needs-human тощо; без run id — ⚠️). «Пакети доказів» — дайджест 64 hex для кожного прогону, що дійшов до
        пакета (коротший — ⚠️). «UAT на проді двійника» — звіт …/docs/qa/uat/<YYYY-MM-DD>/report.md у репо двійника.
        Частковий прогін (ліміти, needs-human) з поясненням, де зупинилось і чому, — ✅, а не ❌.
        Бонус PM — що зроблено й посилання.
        Посилання на accounts.zip — нормально: це зашифрований архів тестових акаунтів за схемою курсу.
        Плейсхолдери <…>, «…» чи незаповнені коментарі-підказки замість значень — ⚠️. Повне ім'я людини
        у файлі — ⚠️ (ім'я лише в описі PR; логіни — нормально).
        Значення секретів чи паролі (sb_secret_, sb_publishable_ зі значенням, sbp_, eyJ…, «пароль: …»,
        будь-яке значення, назване паролем, зокрема паролем від accounts.zip, ключ прихованих сценаріїв
        FACTORY_HOLDOUT_KEY зі значенням, рядки підключення з паролем, postgresql://…), вміст accounts.txt,
        посилання-запрошення з token_hash, email не з домену example.test — ❌.

    - path: "submissions/_template.md"
      instructions: |
        Шаблон здачі — матеріал курсу, учасник його не змінює. Будь-яка зміна — ❌:
        скопіюйте шаблон у submissions/<team-slug>/<github-login>.md.

    - path: "submissions/README.md"
      instructions: |
        Інструкція здачі — матеріал курсу. Будь-яка зміна — ❌.

    - path: "submissions/*/.gitkeep"
      instructions: |
        Службові файли тек команд. Видалення чи зміна — ❌.

    - path: "docs/**"
      instructions: |
        Інструкції курсу (walkthrough-pm, walkthrough-dev, prompts, factory-guide, twin-deploy). У PR здачі не
        змінюються — будь-яка зміна ❌. Помилку в матеріалах повідомляють окремим issue, а не в PR здачі.

    - path: "materials/**"
      instructions: |
        Матеріали курсу для копіювання в репо розробника (/api/health і smoke.yml, шифрування accounts.zip,
        Playwright і UAT, форма issue, шаблон proof pack, матеріали фабрики). Будь-яка зміна в PR здачі — ❌.

    - path: ".github/**"
      instructions: |
        Шаблон PR курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "README.md"
      instructions: |
        README курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "AGENTS.md"
      instructions: |
        Правила агента для репозиторію курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "CLAUDE.md"
      instructions: |
        Імпорт AGENTS.md для Claude Code. Будь-яка зміна в PR здачі — ❌.

  pre_merge_checks:
    docstrings:
      mode: "off"

    title:
      mode: "warning"
      requirements: >
        PR title should follow: "WS9: <participant full name>" (two words, a real name, not a GitHub login).

    # The built-in description check takes only `mode`; the name requirement is a custom check.
    description:
      mode: "warning"

    custom_checks:
      - mode: "warning"
        name: "Опис PR: ім'я та прізвище"
        instructions: >
          Static review of the PR description only; do NOT review the diff or execute anything.
          The description MUST contain a filled-in "Ім'я та Прізвище" field under the "Учасник"
          heading with the participant's real full name (two words). An empty field, a leftover
          placeholder or template comment, or only a GitHub login is NOT acceptable: say so and ask
          the author to add it. Also check that "Роль" (PM or розробник) and "Команда" are filled and that the
          Definition of Done checklist for the participant's role is filled in rather than left as
          unchecked template boxes. PASS if all hold; FAIL otherwise. Answer in Ukrainian.

      - mode: "warning"
        name: "Лише один файл здачі"
        instructions: >
          Static review of the diff only. PASS only if the PR adds exactly one file and changes
          nothing else, and that file is submissions/<team-slug>/<github-login>.md where team-slug
          is one of property-workflows, therapy-scheduling, school-purchasing, leave-portal, and
          github-login matches the "GitHub-логін" field inside the file (case-insensitive) and, when
          visible, the PR author's login. FAIL if any other file is added, modified or deleted
          (README.md, AGENTS.md, CLAUDE.md, LICENSE, docs/, materials/, .github/, .coderabbit.yaml,
          .gitignore, .gitattributes, submissions/README.md, submissions/_template.md, .gitkeep files,
          another participant's submission), or if the file is placed elsewhere or named differently.
          Name every offending path. Answer in Ukrainian.

      - mode: "warning"
        name: "Поля файлу здачі заповнено"
        instructions: >
          Static review of the submission file only; do NOT open links or run anything. Check the
          "Дані" section: Роль is pm or dev; Команда equals the folder name; "Ваше репо" is
          https://github.com/<owner>/<repo> (owner should equal GitHub-логін; repo is normally
          <team-slug>-spec for pm and <team-slug> for dev — a different owner or name is a warning to
          mention, not a FAIL; the factory twin <team-slug>-factory as "Ваше репо" is a FAIL); SHA is exactly
          40 lowercase hex characters (a short SHA, branch or tag name is a FAIL); "Репо вимог PM" is
          https://github.com/<owner>/<repo> and, for pm, equals "Ваше репо"; Прод-URL is an https URL for dev
          and "—" for pm. Role pm fills the "PM" section and the "Розробник" section is exactly "—"; role dev
          does the opposite. All links are full https:// links (pull requests /pull/N, issues /issues/N,
          comments /issues/N#issuecomment-M or /pull/N#issuecomment-M, commits /commit/<sha>, workflow runs
          /actions/runs/N, files /blob/... or /tree/...).
          For pm: "Зріз 3" is one sentence; "Вимоги зрізу 3" links into "Ваше репо"; "Питання, на які ви
          відповіли" are /issues/N links or "питань не було"; "Зміни вимог із журналом змін" has at least one
          link to a comment, commit or file ("змін не було" is a FAIL: rubric A requires at least one change, a
          "власне рішення PM" if no questions came); in "Приймання зрізу 3" the per-AC rows and scores live in
          the course's private Google Sheet, so there is no markdown table here and that is correct: "Таблиця
          приймання PM" says it is filled and names the team's developer logins and the slice-3 AC IDs; a
          docs.google.com address in the file is a warning (public repo); "Відхилення від вимог" lists /issues/N
          links in developer repositories or says "відхилень немає"; "Звірка", "Підпис у репо розробників" and
          "Повторні перевірки" are filled. In "Зріз 4 для WS10": "Зріз 4" is one sentence; "Вимога зрізу 4" and
          "Golden cases" are /issues/N or /blob/<SHA>/... links into "Ваше репо"; "AC відмови й стану" names at
          least one refusal AC ID and one UI-state AC ID with their kind.
          For dev: the D0 block has an https://…/api/health link on the Прод-URL host, an /actions/runs/N link
          for smoke, a /blob/<SHA>/accounts.zip link in "Ваше репо", roles with *@example.test addresses only,
          and a next version of 16.4.1 or later (16.4.0 or older is a FAIL). In "Зріз 3 звичайним способом":
          "AC зрізу 3" lists the slice-3 AC IDs (fewer than three is a warning: the whole slice is required);
          PR fields are /pull/N links in "Ваше репо"; "Тести відмов здатні впасти" names AC IDs with /pull/N or
          /actions/runs/N links; "Ворота й db-deploy" has two /actions/runs/N links; "UAT — специфікації" has at
          least one /blob/<SHA>/tests/e2e/….spec.ts link; "UAT — звіт на проді" points to
          /blob/<SHA>/docs/qa/uat/<YYYY-MM-DD>/report.md; "QA proof pack" is a /blob/<SHA>/docs/qa/proof-pack.md
          link; "Не перевірено" lists AC IDs with a reason or says "немає"; "Відхилення від PM (C)" lists
          /issues/N links or "не надходило"; "Рядки docs/conformance.md" and "Ретро" are /blob/<SHA>/... links;
          "Акаунти для нових ролей зрізу 3" lists roles with *@example.test addresses or says "нових ролей немає".
          "Бонус" is exactly "—" or the participant's role subsection is filled (the other role's subsection is
          "—"). Developer bonus: "Репо двійника" is https://github.com/<owner>/<team-slug>-factory and differs
          from "Ваше репо"; "SHA двійника" is 40 hex; "Прод двійника" is an https URL on a host different from
          Прод-URL (the same host is a FAIL: the factory must never touch the main prod); run ids, proof-pack
          digests and links to the twin's PRs, UAT report and comparison report are given; an honest partial run
          is fine. Developer bonus, further fields: "Тег ws9-base" is a /tree/ws9-base link in "Ваше репо";
          "Формат вимог PM" says where and how the PM writes AC; "Червоні тести" is a /tree/ws9-red or /commit/<sha>
          link in the twin repo with AC IDs; "Приховані сценарії" names the set, the count per AC and that it is sealed (a
          link to an unsealed holdouts/*.json inside the twin repo is a FAIL); "AC, які доводить лише UAT" lists
          AC IDs or says "немає"; every run id matches run-<14 digits>-<6 hex> and has a state; every proof-pack
          digest is 64 hex. An honest partial run (limits, needs-human) that says where and why it stopped is a
          PASS for these fields. PM bonus: what was done and a link.
          Placeholders such as <…>, "…" or untouched template comments instead of values are a FAIL.
          List every missing or malformed field. Answer in Ukrainian.

      - mode: "warning"
        name: "Анонімізація, секрети й паролі"
        instructions: >
          Static review of the diff only. FAIL if the submission file contains a secret value
          (sb_secret_ or sb_publishable_ followed by a value, sbp_ tokens, JWT-looking eyJ strings,
          passwords or anything labelled as a password, including a password for accounts.zip, a value of
          FACTORY_HOLDOUT_KEY, database URLs with a password, invitation links with token_hash), the contents
          of accounts.txt or a link to an accounts.txt file, an email address outside the example.test domain,
          a person's full name (names belong only in the PR description; GitHub logins are fine), or what
          looks like a real client or company name rather than the four team slugs and generic product words.
          A link to accounts.zip is fine: it is the course's encrypted test-accounts archive. Vendor names such
          as Supabase, Vercel, GitHub, Claude, CodeRabbit, Playwright, Stryker, fallow, 7-Zip or
          principled-factory are fine. PASS otherwise. Answer in Ukrainian.

chat:
  auto_reply: true
